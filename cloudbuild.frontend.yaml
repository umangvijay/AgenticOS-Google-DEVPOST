timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: node:20-alpine
    dir: frontend
    entrypoint: sh
    args: ['-c', 'npm ci && npm run lint -- --max-warnings=0 && npm test && npm run typecheck']
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile.frontend
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - -t
      - ${_FRONTEND_IMAGE}
      - frontend
images:
  - ${_FRONTEND_IMAGE}
substitutions:
  _SITE_URL: ''
  _GOOGLE_CLIENT_ID: ''
  _API_URL: 'https://REPLACE_API_HOST/api/v1'
  _FRONTEND_IMAGE: 'us-central1-docker.pkg.dev/${PROJECT_ID}/agentos/frontend:latest'

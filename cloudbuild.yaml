# Build immutable API and worker images. Deployment is deliberately separate:
# API secrets/IAM and a Cloud Run Worker Pool must be configured explicitly.
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  # Build API image (root Dockerfile) — COMMIT_SHA is Cloud Build's built-in
  # substitution, baked into the image so /api/v1/health can report it.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'COMMIT_SHA=${COMMIT_SHA}', '-t', '${_API_IMAGE}', '-f', 'Dockerfile', '.']

  # Build Worker image (Dockerfile.worker)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'COMMIT_SHA=${COMMIT_SHA}', '-t', '${_WORKER_IMAGE}', '-f', 'Dockerfile.worker', '.']

  # The repository suite imports scripts and inspects docs/configs that are
  # intentionally absent from production images. Derive a test-only image from
  # the API image so Python and its dependencies stay the same.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'API_IMAGE=${_API_IMAGE}', '-t', '${_API_IMAGE}-tests', '-f', 'Dockerfile.test', '.']

  # No cloud credentials or network access during tests. The test image is not pushed.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--network=none', '-e', 'APP_ENV=development', '-e', 'STORAGE_BACKEND=sqlite', '-e', 'SQLITE_DB_PATH=/tmp/release.db', '-e', 'JWT_PRIVATE_KEY_PATH=/tmp/keys/private.pem', '-e', 'JWT_PUBLIC_KEY_PATH=/tmp/keys/public.pem', '${_API_IMAGE}-tests']
  # Also check the actual production image without the test-only source overlay.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--network=none', '-e', 'APP_ENV=development', '-e', 'STORAGE_BACKEND=sqlite', '${_API_IMAGE}', 'python', '-c', 'import backend.api.main']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--network=none', '${_WORKER_IMAGE}', 'python', '-c', 'from google.cloud import pubsub_v1; import backend.worker']

images:
  - '${_API_IMAGE}'
  - '${_WORKER_IMAGE}'
substitutions:
  _API_IMAGE: 'gcr.io/${PROJECT_ID}/agentos-api'
  _WORKER_IMAGE: 'gcr.io/${PROJECT_ID}/agentos-worker'
  _REGION: 'us-central1'

{{- $fullname := include "agentos.fullname" . -}}
{{- $global := .Values.global -}}

# ── API ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ $fullname }}-api
  template:
    metadata:
      labels:
        app: {{ $fullname }}-api
        {{- include "agentos.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "agentos.image" (dict "global" $global "image" .Values.api.image "digest" .Values.api.imageDigest) }}
          imagePullPolicy: {{ $global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            # Phase 22 (kind install): the image bakes PORT=8080 while the
            # Service targets api.port — pin the listen port to the port
            # the Service actually forwards to.
            - name: PORT
              value: {{ .Values.api.port | quote }}
            {{- include "agentos.storageEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.secrets.external }}
          envFrom:
            {{- range $name, $spec := .Values.secrets.external }}
            - secretRef:
                name: {{ $name }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet: { path: {{ .Values.api.probes.livenessPath }}, port: {{ .Values.api.port }} }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: {{ .Values.api.probes.readinessPath }}, port: {{ .Values.api.port }} }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
# ── Worker pool ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ $fullname }}-worker
  template:
    metadata:
      labels:
        app: {{ $fullname }}-worker
    spec:
      containers:
        - name: worker
          image: {{ include "agentos.image" (dict "global" $global "image" .Values.worker.image "digest" .Values.worker.imageDigest) }}
          imagePullPolicy: {{ $global.imagePullPolicy }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          env:
            {{- include "agentos.storageEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            {{- range $name, $spec := .Values.secrets.external }}
            - secretRef:
                name: {{ $name }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- if .Values.browserWorker.enabled }}
---
# ── Browser worker (§20.15/20.16 viewer/takeover authority) ────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-browser-worker
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser-worker
spec:
  replicas: {{ .Values.browserWorker.replicaCount }}
  selector:
    matchLabels:
      app: {{ $fullname }}-browser-worker
  template:
    metadata:
      labels:
        app: {{ $fullname }}-browser-worker
    spec:
      containers:
        - name: browser-worker
          image: {{ include "agentos.image" (dict "global" $global "image" .Values.browserWorker.image "digest" .Values.browserWorker.imageDigest) }}
          imagePullPolicy: {{ $global.imagePullPolicy }}
          command:
            {{- toYaml .Values.browserWorker.command | nindent 12 }}
          env:
            {{- include "agentos.storageEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.browserWorker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            {{- range $name, $spec := .Values.secrets.external }}
            - secretRef:
                name: {{ $name }}
            {{- end }}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
{{- end }}
{{- if .Values.runner.enabled }}
---
# ── Isolated runner (§20.14): cap_drop ALL, non-root, no escalation ────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-runner
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runner.replicaCount }}
  selector:
    matchLabels:
      app: {{ $fullname }}-runner
  template:
    metadata:
      labels:
        app: {{ $fullname }}-runner
    spec:
      containers:
        - name: runner
          image: {{ include "agentos.image" (dict "global" $global "image" .Values.runner.image "digest" .Values.runner.imageDigest) }}
          imagePullPolicy: {{ $global.imagePullPolicy }}
          command:
            {{- toYaml .Values.runner.command | nindent 12 }}
          env:
            {{- include "agentos.storageEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.runner.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.runner.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
{{- end }}
{{- if .Values.frontend.replicaCount }}
---
# ── Frontend ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ $fullname }}-frontend
  template:
    metadata:
      labels:
        app: {{ $fullname }}-frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "agentos.image" (dict "global" $global "image" .Values.frontend.image "digest" .Values.frontend.imageDigest) }}
          # Phase 22 (kind install): :latest tags default to Always —
          # honor the global policy so locally loaded images deploy.
          imagePullPolicy: {{ $global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            {{- range $k, $v := .Values.frontend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
{{- end }}
